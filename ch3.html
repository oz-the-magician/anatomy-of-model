<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Анатомия картинки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed WebGL stage — prompt + text encoder above a 64×64×4 latent that denoises into an image; mono HUD, two-row rail */
:root{
  --void:#0c1428; --ink:#e8ecff; --dim:#8a93b8; --query:#7fd4ff; --branch:#b48cff; --answer:#ffe7a3;
  --display:"Russo One",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden}
canvas{display:block}
[hidden]{display:none!important}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(4,7,16,.7) 100%)}
.hud{position:fixed;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tl{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(430px,58vw)}
.tl h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.2vw,32px);margin:0 0 8px;letter-spacing:.01em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.tl .act{display:block;color:var(--answer);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em}
.tl p{margin:0;color:var(--dim);line-height:1.6}
.tr{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.7;max-width:46vw}
.tr span{color:var(--ink)}
.tr em{font-style:normal}
.tr .gold{color:var(--answer)}
.tr .sep{display:block;height:6px}
.tr .note{display:block;margin-top:8px;color:var(--dim);opacity:.75;max-width:240px;margin-left:auto;line-height:1.5;font-size:10px}
.bar{display:inline-block;width:80px;height:4px;background:#1d2850;vertical-align:middle;margin-left:6px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--query)}
.bar.g i{background:var(--answer)}
.rail{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px}
.rail .row{display:flex;gap:6px;flex-wrap:wrap}
.rail button{pointer-events:auto;background:transparent;border:1px solid #2a3560;color:var(--dim);padding:7px 9px;border-radius:2px;font:inherit;cursor:pointer;transition:.3s}
.rail button.on{color:var(--void);background:var(--ink);border-color:var(--ink)}
.rail button.again{color:var(--void);background:var(--answer);border-color:var(--answer);box-shadow:0 0 24px rgba(255,231,163,.35)}
.rail button:focus-visible{outline:2px solid var(--query);outline-offset:2px}
.say{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));text-align:center;font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);line-height:1.5;pointer-events:none;transition:opacity .5s;text-shadow:0 1px 12px rgba(4,7,16,.9)}
.cfg{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:110px;width:min(270px,calc(100vw - 32px));max-height:calc(100% - 170px);overflow:auto;background:rgba(12,20,40,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #2a3560;border-radius:4px;padding:14px;font-family:var(--mono);font-size:11px;color:var(--dim);display:grid;gap:12px;z-index:5}
.cfg h2{margin:0;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cfg label{display:grid;grid-template-columns:1fr auto;gap:5px 8px;letter-spacing:.04em}
.cfg output{color:var(--ink);font-variant-numeric:tabular-nums}
.cfg input{grid-column:1/-1;width:100%;margin:0;accent-color:var(--query)}
.cfg button{justify-self:start;background:transparent;border:1px solid #2a3560;color:var(--dim);padding:6px 9px;border-radius:2px;font:inherit;cursor:pointer}
.cfg button:focus-visible,.cfg input:focus-visible{outline:2px solid var(--query);outline-offset:2px}
@media (max-width:700px){.tr .note{display:none}}
.pp{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 32px));background:rgba(12,20,40,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid #2a3560;border-radius:4px;padding:16px 18px;font-family:var(--mono);pointer-events:none;z-index:3}
.pph{font-family:var(--display);text-transform:uppercase;font-size:12px;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
.ppt{font-size:clamp(14px,1.9vw,19px);line-height:1.5;color:var(--ink);min-height:3em}
.caret{display:inline-block;width:.55em;height:1.1em;background:var(--query);vertical-align:-.2em;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-height:26px}
.chip{border:1px solid #4a5590;color:var(--query);background:rgba(12,20,40,.9);padding:4px 8px;border-radius:2px;font-size:11px;opacity:0;will-change:transform}
.ppn{margin-top:12px;color:var(--dim);font-size:11px;line-height:1.5}
html.embed .rail{bottom:44px}html.embed .say,html.embed .cfg{margin-bottom:44px}html.embed .again{display:none!important}</style>

<div class="vig"></div>
<div class="hud tl">
  <h1 data-t="title">Анатомия картинки</h1>
  <span class="act" data-t="sub">Диффузионная модель</span>
  <p data-t="desc"></p>
</div>
<div class="hud tr">
  <em data-t="hPrompt"></em> <span id="h-prompt" class="gold">—</span><br>
  <em data-t="hStage"></em> <span id="h-stage">—</span><br>
  <em data-t="hStep"></em> <span id="h-step">0 / 30</span><br>
  <em data-t="hNoise"></em> <span id="h-noise">1.00</span><span class="bar"><i id="h-bar"></i></span><br>
  <span class="sep"></span>
  <em data-t="hSeen"></em><br>
  <em data-t="fLow"></em><span class="bar g"><i id="f-low"></i></span><br>
  <em data-t="fMid"></em><span class="bar g"><i id="f-mid"></i></span><br>
  <em data-t="fHigh"></em><span class="bar g"><i id="f-high"></i></span><br>
  <span class="sep"></span>
  <em data-t="hFix"></em> <span id="h-fix">—</span><span class="bar"><i id="h-fixb"></i></span><br>
  <em data-t="hWord"></em> <span id="h-word" class="gold">—</span><br>
  <em data-t="hGuide"></em> <span id="h-guide">7.0</span><br>
  <em data-t="hSeed"></em> <span id="h-seed">—</span><br>
  <em data-t="hLatent"></em> <span id="h-lat">64 × 64 × 4</span><br>
  <em data-t="hOut"></em> <span id="h-out">—</span>
  <span class="note" data-t="note"></span>
</div>
<div class="pp" id="pp" hidden><div class="pph" data-t="ppHead"></div><div class="ppt"><span id="pp-text"></span><i class="caret"></i></div><div class="chips"><span class="chip" data-to="h-lat" id="ch-size"></span><span class="chip" data-to="h-step" id="ch-steps"></span><span class="chip" data-to="h-guide" id="ch-guide"></span><span class="chip" data-to="h-seed" id="ch-seed"></span></div><div class="ppn" data-t="ppNote"></div></div>
<div class="say" id="say"></div>
<div class="cfg" id="cfg" hidden>
  <h2 data-t="cfg">Настройки</h2>
  <label for="c-br"><span data-t="c_br"></span> <output id="o-br"></output><input type="range" id="c-br" min="0.6" max="2.2" step="0.05"></label>
  <label for="c-speed"><span data-t="c_speed"></span> <output id="o-speed"></output><input type="range" id="c-speed" min="0.25" max="2.5" step="0.05"></label>
  <label for="c-dur"><span data-t="c_dur"></span> <output id="o-dur"></output><input type="range" id="c-dur" min="0.6" max="2" step="0.05"></label>
  <label for="c-cam"><span data-t="c_cam"></span> <output id="o-cam"></output><input type="range" id="c-cam" min="0.3" max="2.5" step="0.05"></label>
  <label for="c-star"><span data-t="c_star"></span> <output id="o-star"></output><input type="range" id="c-star" min="0.4" max="2" step="0.05"></label>
  <label for="c-dens"><span data-t="c_dens"></span> <output id="o-dens"></output><input type="range" id="c-dens" min="0" max="1" step="0.05"></label>
  <button type="button" id="c-reset" data-t="reset">Сбросить</button>
</div>
<nav class="rail" id="rail"></nav>

  stage:['ввод промпта','токенизация + таблица','кодировщик текста','автокодировщик (VAE)','стартовый шум','U-Net / трансформер','U-Net / трансформер','декодер VAE'],

 g=fx.createRadialGradient(c,c,0,c,c,9);g.addColorStop(0,'#fff');g.addColorStop(.6,'rgba(255,255,255,.8)');g.addColorStop(1,'rgba(255,255,255,0)');

const add=(tex,col,sz)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.scale.setScalar(sz);m.userData.sz=sz;m.material.opacity=0;S.add(m);return m};
