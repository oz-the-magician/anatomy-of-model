<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Анатомия мысли</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed WebGL stage, two zoom levels (mechanics → thinking), mono HUD in corners, phase rail at bottom */
:root{
  --void:#0c1428; --ink:#e8ecff; --dim:#8a93b8; --query:#7fd4ff; --branch:#b48cff; --answer:#ffe7a3;
  --display:"Russo One",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden}
canvas{display:block}
[hidden]{display:none!important}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(4,7,16,.7) 100%)}
.fade{position:fixed;inset:0;pointer-events:none;background:var(--void);opacity:0}
.hud{position:fixed;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tl{top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));max-width:min(430px,60vw)}
.tl h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.2vw,32px);margin:0 0 8px;letter-spacing:.01em;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.tl .act{display:block;color:var(--answer);margin-bottom:6px;text-transform:uppercase;letter-spacing:.12em}
.tl p{margin:0;color:var(--dim);line-height:1.6}
.tr{top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;line-height:1.7;max-width:46vw}
.tr span{color:var(--ink)}
.tr .gold{color:var(--answer)}
.tr em{font-style:normal}
.tr .note{display:block;margin-top:8px;color:var(--dim);opacity:.75;max-width:230px;margin-left:auto;line-height:1.5;font-size:10px}
.rail{position:fixed;left:0;right:0;bottom:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:11px}
.rail .row{display:flex;gap:6px;flex-wrap:wrap}
.rail button{pointer-events:auto;background:transparent;border:1px solid #2a3560;color:var(--dim);padding:7px 9px;border-radius:2px;font:inherit;cursor:pointer;transition:.3s}
.rail button.on{color:var(--void);background:var(--ink);border-color:var(--ink)}
.rail button.b-act{border-color:#5a4a80}
.rail button.gap{margin-left:10px}
.rail button:focus-visible{outline:2px solid var(--query);outline-offset:2px}
.rail button.again{color:var(--void);background:var(--answer);border-color:var(--answer);box-shadow:0 0 24px rgba(255,231,163,.35)}
.say{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100vw - 32px));text-align:center;font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);line-height:1.5;pointer-events:none;transition:opacity .5s;text-shadow:0 1px 12px rgba(4,7,16,.9)}
.cfg{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(270px,calc(100vw - 32px));max-height:calc(100% - 170px);overflow:auto;background:rgba(12,20,40,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid #2a3560;border-radius:4px;padding:14px;font-family:var(--mono);font-size:11px;color:var(--dim);display:grid;gap:12px;z-index:5}
.cfg h2{margin:0;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.cfg label{display:grid;grid-template-columns:1fr auto;gap:5px 8px;letter-spacing:.04em}
.cfg output{color:var(--ink);font-variant-numeric:tabular-nums}
.cfg input{grid-column:1/-1;width:100%;margin:0;accent-color:var(--query)}
.cfg button{justify-self:start;background:transparent;border:1px solid #2a3560;color:var(--dim);padding:6px 9px;border-radius:2px;font:inherit;cursor:pointer}
.cfg button:focus-visible,.cfg input:focus-visible{outline:2px solid var(--query);outline-offset:2px}
@media (max-width:700px){.tr .note{display:none}.say{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
html.embed .rail{bottom:44px}html.embed .say,html.embed .cfg{margin-bottom:44px}html.embed .again{display:none!important}</style>

<div class="vig"></div>
<div class="fade" id="fade"></div>
<div class="hud tl">

  <span class="act" id="actlbl">Масштаб 1 · один шаг</span>
  <p id="actdesc">Как сеть выбирает одно следующее слово: токены → слои внимания → общий поток → вероятности → выбор.</p>

  <em data-t="hStep"></em> <span id="h-step">1</span><br>

  <em data-t="hLayer"></em> <span id="h-layer">—</span><br>
  <em data-t="hHeads"></em> <span id="h-heads">—</span><br>
  <em data-t="hLinks"></em> <span id="h-links">0</span><br>
  <em data-t="hTop"></em> <span id="h-top" class="gold">—</span><br>
  <em data-t="hTemp"></em> <span>0.7</span><br>
  <em data-t="hPick"></em> <span id="h-pick" class="gold">—</span>
  <span class="note" data-t="noteA"></span>
</div>
<div class="hud tr" id="hudB" hidden>
  <em data-t="bTok"></em> <span id="b-tok">0</span><br>
  <em data-t="bHyp"></em> <span id="b-hyp">0</span><br>
  <em data-t="bCut"></em> <span id="b-cut">0</span><br>
  <em data-t="bConf"></em> <span id="b-conf">0%</span><br>
  <em data-t="bDep"></em> <span id="b-dep">0</span><br>
  <em data-t="bEnt"></em> <span id="b-ent">0.00</span><br>
  <em data-t="bTps"></em> <span id="b-tps">0</span>
  <span class="note" data-t="noteB"></span>
</div>
<div class="say" id="say"></div>
<div class="cfg" id="cfg" hidden>
  <h2 data-t="cfg">Настройки</h2>
  <label for="c-br"><span data-t="c_br">яркость</span> <output id="o-br"></output><input type="range" id="c-br" min="0.6" max="2.2" step="0.05"></label>
  <label for="c-speed"><span data-t="c_speed">скорость сцены</span> <output id="o-speed"></output><input type="range" id="c-speed" min="0.25" max="2.5" step="0.05"></label>
  <label for="c-dur"><span data-t="c_dur">длина фаз</span> <output id="o-dur"></output><input type="range" id="c-dur" min="0.6" max="2" step="0.05"></label>
  <label for="c-cam"><span data-t="c_cam">плавность камеры</span> <output id="o-cam"></output><input type="range" id="c-cam" min="0.3" max="2.5" step="0.05"></label>
  <label for="c-star"><span data-t="c_star">размер звёзд</span> <output id="o-star"></output><input type="range" id="c-star" min="0.4" max="2" step="0.05"></label>
  <label for="c-dens"><span data-t="c_dens">плотность нитей</span> <output id="o-dens"></output><input type="range" id="c-dens" min="0" max="1" step="0.05"></label>
  <label for="c-vol"><span data-t="c_vol">громкость голоса</span> <output id="o-vol"></output><input type="range" id="c-vol" min="0" max="1" step="0.05"></label>
  <button type="button" id="c-reset" data-t="reset">Сбросить</button>
</div>
<nav class="rail" id="rail"></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ================= content =================
const TXT={
 ru:{
  title:'Анатомия мысли',
  ph:[["01","токены","Текст режется на токены — и каждый становится вектором."],
   ["02","внимание","В каждом слое блоки внимания разом смотрят на все прошлые токены."],
   ["03","поток","Каждый слой дописывает свою поправку. Смысл уточняется снизу вверх."],
   ["04","вероятности","На выходе — не мысль, а вероятности следующего токена."],
   ["05","выбор","Выбран один токен. Он встаёт в конец — и всё повторяется."],
   ["06","тысячи шагов","И так тысячи раз. Ряд токенов сворачивается в смысл, из него растёт рассуждение."],
   ["07","понимание","Каждый новый токен оглядывается на запрос и на всё, что написано до него."],
   ["08","ветвление","Из понимания растут гипотезы. Каждая ветвь — цепочка токенов."],
   ["09","проверка","Слабые ветви, такие как ошибки и противоречия, гаснут. Сильные набирают свет."],
   ["10","ответ","Выжившие линии сходятся в одно ядро. Это и есть ответ."]],
  act:[["Масштаб 1 · один шаг","Как сеть выбирает одно следующее слово: токены → слои внимания → общий поток → вероятности → выбор."],
   ["Масштаб 2 · тысячи шагов","Из множества таких шагов складывается рассуждение: гипотезы растут, слабые гаснут, сильные сходятся в ответ."]],
  ctx:["как","бы","ты","визуал","изировал","своё","мыш","ление"],
  steps:[[["Я",.46],["Сначала",.17],["Если",.11],["Мне",.08],["Вот",.05],["Хм",.03]],[["бы",.52]],[["показал",.38]],[["поток",.29]],[["токенов",.44]]],
  hStep:'шаг генерации',hCtx:'длина контекста, ток.',hLayer:'слой',hHeads:'блоков в слое',hLinks:'связей внимания',hTop:'топ-1',hTemp:'температура',hPick:'выбран токен',
  noteA:'12 слоёв по 8 блоков внимания — упрощение для наглядности. В настоящих моделях их в разы больше, веса внимания здесь иллюстративные.',
  bTok:'токенов рассуждения',bHyp:'активных гипотез',bCut:'отсечено',bConf:'уверенность',bDep:'глубина дерева',bEnt:'энтропия',bTps:'скорость',
  noteB:'Каждая бусина на ветви — тысячи проходов из первого масштаба. Ветвление и отсечение происходят в тексте рассуждения, а не в скрытом дереве.',
  cfg:'Настройки',c_br:'яркость',c_speed:'скорость сцены',c_dur:'длина фаз',c_cam:'плавность камеры',c_star:'размер звёзд',c_dens:'плотность нитей',c_vol:'громкость голоса',reset:'Сбросить',
  auto:'▶ авто',camA:'◉ камера: авто',camF:'○ камера: свободно',vOn:'🔊 голос',vOff:'🔈 голос',gear:'⚙ настройки',again:'↺ ещё раз',lang:'EN',
  par:' × параллельно',bits:' бит',tps:' ток/с',layer:'слой ',step:'шаг ',loc:'ru-RU'},
 en:{
  title:'Anatomy of Thought',
  ph:[["01","tokens","Text is cut into tokens — and each one becomes a vector."],
   ["02","attention","In every layer, attention blocks look at all earlier tokens at once."],
   ["03","stream","Each layer adds its own correction. Meaning sharpens from the bottom up."],
   ["04","probabilities","What comes out is not a thought — just probabilities for the next token."],
   ["05","choice","One token is chosen. It joins the end — and everything repeats."],
   ["06","1000s of steps","Thousands of times over. The row of tokens folds into meaning, and reasoning grows from it."],
   ["07","understanding","Every new token looks back at the prompt and at everything written before it."],
   ["08","branching","Hypotheses grow from understanding. Each branch is a chain of tokens."],
   ["09","checking","Weak branches, such as errors and contradictions, fade out. Strong ones gather light."],
   ["10","answer","The surviving lines converge into one core. That is the answer."]],
  act:[["Scale 1 · one step","How the network picks one next word: tokens → attention layers → shared stream → probabilities → choice."],
   ["Scale 2 · thousands of steps","Many such steps add up to reasoning: hypotheses grow, weak ones fade, strong ones converge into an answer."]],
  ctx:["how","would","you","visual","ize","your","think","ing"],
  steps:[[["I",.46],["First",.17],["If",.11],["Let",.08],["Here",.05],["Hmm",.03]],[["would",.52]],[["show",.38]],[["a",.29]],[["stream",.44]]],
  hStep:'generation step',hCtx:'context length, tok.',hLayer:'layer',hHeads:'blocks per layer',hLinks:'attention links',hTop:'top-1',hTemp:'temperature',hPick:'chosen token',
  noteA:'12 layers of 8 attention blocks is a simplification. Real models have many times more, and the attention weights here are illustrative.',
  bTok:'reasoning tokens',bHyp:'active hypotheses',bCut:'pruned',bConf:'confidence',bDep:'tree depth',bEnt:'entropy',bTps:'speed',
  noteB:'Every bead on a branch stands for thousands of passes from scale 1. Branching and pruning happen in the reasoning text, not in a hidden tree.',
  cfg:'Settings',c_br:'brightness',c_speed:'scene speed',c_dur:'phase length',c_cam:'camera smoothness',c_star:'star size',c_dens:'thread density',c_vol:'voice volume',reset:'Reset',
  auto:'▶ auto',camA:'◉ camera: auto',camF:'○ camera: free',vOn:'🔊 voice',vOff:'🔈 voice',gear:'⚙ settings',again:'↺ again',lang:'RU',
  par:' × parallel',bits:' bits',tps:' tok/s',layer:'layer ',step:'step ',loc:'en-US'}
};
let LANG='ru';try{LANG=localStorage.getItem('anatlang')||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en')}catch(e){}
if(!TXT[LANG])LANG='ru';
const L=()=>TXT[LANG];
let PH=L().ph,ACT=L().act,CTX=L().ctx,STEPS=L().steps;
const DURS=[8,10,9,8,8,10,9,9,8.6,10];
// narration: one track per language, one clip per phase (lengths in seconds)
const CLIP={ru:Array(10).fill(0),en:Array(10).fill(0)};
const CUTS={};for(const k in CLIP){let a=0;CUTS[k]=[0,...CLIP[k].map(d=>a+=d)]}
const C={q:0x7fd4ff,b:0xb48cff,p:0xff5a7a,a:0xffe7a3};
const HEADC=[0x7fd4ff,0x9ab8ff,0xb48cff,0xd59cff,0xffb38a,0xffd59a,0x8ff0e0,0xa8c8ff];
const LN=12,HN=8,DY=1.6,Y0=2,TOP=Y0+(LN-1)*DY,SP=2.4;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
const $=id=>document.getElementById(id);

// ================= settings (OZ's defaults) =================
const CFG0={br:1.35,speed:1.25,dur:.85,cam:2.5,star:.9,dens:1,vol:1},CFG={...CFG0};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('anatcfg3')||'{}'))}catch(e){}
const pct=v=>Math.round(v*100)+'%',x2=v=>v.toFixed(2)+'×';
const fmt={br:pct,speed:x2,dur:x2,cam:x2,star:x2,dens:pct,vol:pct};

// ================= renderer, two worlds =================
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.setClearColor(0x0c1428);
document.body.prepend(R.domElement);
const S=new THREE.Scene();S.fog=new THREE.FogExp2(0x0c1428,.006);
const gA=new THREE.Group(),gB=new THREE.Group();S.add(gA,gB);
const OFF=V(8.4,12,0);gB.position.copy(OFF); // world B (thinking) lives here: its query ring sits exactly where the token row is
let BS=gA; // group that helpers add into
const cam=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,800);
cam.position.set(9,3,30);
const ctl=new THREE.OrbitControls(cam,R.domElement);ctl.enableDamping=true;ctl.target.set(9,1,0);
let camAuto=true,lastTouch=0;
ctl.addEventListener('start',()=>{camAuto=false;lastTouch=performance.now();updCamBtn()});
ctl.addEventListener('change',()=>{if(!camAuto)lastTouch=performance.now()});

// ================= textures =================
const gc=document.createElement('canvas');gc.width=gc.height=64;{const x=gc.getContext('2d');
 const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.25,'rgba(255,255,255,.6)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}
const glow=new THREE.CanvasTexture(gc);
const fc=document.createElement('canvas');fc.width=fc.height=256;{const fx=fc.getContext('2d'),c=128;
 let g=fx.createRadialGradient(c,c,0,c,c,128);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.1,'rgba(255,255,255,.16)');g.addColorStop(.45,'rgba(255,255,255,.03)');g.addColorStop(1,'rgba(255,255,255,0)');
 fx.fillStyle=g;fx.fillRect(0,0,256,256);fx.globalCompositeOperation='lighter';fx.lineCap='round';
 for(let k=0;k<18;k++){const a=k/18*6.283+Math.random()*.25,L=38+Math.random()*70,bend=(Math.random()-.5)*1.2;
  const ex=c+Math.cos(a)*L,ey=c+Math.sin(a)*L,mx=c+Math.cos(a+bend)*L*.5,my=c+Math.sin(a+bend)*L*.5;
  const lg=fx.createLinearGradient(c,c,ex,ey);lg.addColorStop(0,'rgba(255,255,255,.95)');lg.addColorStop(.35,'rgba(255,255,255,.35)');lg.addColorStop(1,'rgba(255,255,255,0)');
  fx.strokeStyle=lg;fx.lineWidth=.7+Math.random()*.7;fx.beginPath();fx.moveTo(c,c);fx.quadraticCurveTo(mx,my,ex,ey);fx.stroke()}
 g=fx.createRadialGradient(c,c,0,c,c,9);g.addColorStop(0,'#fff');g.addColorStop(.6,'rgba(255,255,255,.8)');g.addColorStop(1,'rgba(255,255,255,0)');
 fx.fillStyle=g;fx.beginPath();fx.arc(c,c,9,0,6.283);fx.fill()}
const flareTex=new THREE.CanvasTexture(fc);

// ================= helpers =================
const lmat=(col,vc)=>new THREE.LineBasicMaterial({color:vc?0xffffff:col,vertexColors:!!vc,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
const add=(tex,col,sz)=>{const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.scale.setScalar(sz);m.userData.sz=sz;m.material.opacity=0;BS.add(m);return m};
const line=(pts,col,loop)=>{const l=new (loop?THREE.LineLoop:THREE.Line)(new THREE.BufferGeometry().setFromPoints(pts),lmat(col));BS.add(l);return l};
function label(text,col,px){px=px||44;const c=document.createElement('canvas'),x=c.getContext('2d');
 const font=px+'px "JetBrains Mono", ui-monospace, monospace';x.font=font;const w=Math.ceil(x.measureText(text).width)+12;
 c.width=w;c.height=Math.ceil(px*1.4);x.font=font;x.fillStyle=col;x.textBaseline='middle';x.fillText(text,6,c.height/2);
 const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,opacity:0}));
 const h=px/44*.5;s.scale.set(h*w/c.height,h,1);BS.add(s);return s}
function kill(o){if(o.parent)o.parent.remove(o);if(o.material.map&&o.material.map!==glow&&o.material.map!==flareTex)o.material.map.dispose();o.material.dispose();if(!o.isSprite)o.geometry.dispose()}
function star(col,s){const f=add(flareTex,col,4.2*s),c=add(glow,0xffffff,1*s),h=add(glow,0xffc9a8,2.4*s);
 return{f,c,h,set(p){f.position.copy(p);c.position.copy(p);h.position.copy(p)},
  op(v){f.material.opacity=v;c.material.opacity=v;h.material.opacity=v*.12;[f,c,h].forEach(m=>m.scale.setScalar(m.userData.sz*CFG.star))},
  kill(){[f,c,h].forEach(kill)}}}
function background(scene,cx,cy){BS=scene;const shells=[];
 [[70,1800,.18,0x4a5590],[140,2200,.35,0x6a5aa8],[260,1600,.7,0x8a9ad8]].forEach(([r,n,sz,col])=>{
  const g=new THREE.BufferGeometry(),p=new Float32Array(n*3);
  for(let i=0;i<n;i++){const u=Math.random()*2-1,a=Math.random()*6.283,d=r*(.6+Math.random()*.4),s=Math.sqrt(1-u*u);
   p[i*3]=Math.cos(a)*s*d+cx;p[i*3+1]=u*d+cy;p[i*3+2]=Math.sin(a)*s*d}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:sz,color:col,map:glow,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  scene.add(pts);shells.push(pts)});
 [[0x1e4a9a,-30,-20,-100,150,.35],[0x5a2a8a,60,10,-120,170,.3],[0x8a5a20,-20,50,-90,130,.22],[0x203a7a,-90,0,40,150,.25],[0x4a1a5a,80,-30,60,130,.25]].forEach(([c,x,y,z,s,o])=>{
  const n=add(glow,c,s);n.position.set(x+cx,y+cy,z);n.material.opacity=o;n.material.fog=false});
 return shells}

// =====================================================================
// WORLD A — mechanics of one generation step
// =====================================================================

  else if(phase===2){P=V(midX-30*far,4+u*15,11*far);Tg=V(midX,4+u*13,0)}
  else if(phase===3){P=V(lastX+9,TOP+5,26*far);Tg=V(lastX+3.5,TOP+5.5,0)}
  else if(phase===4){const k=ease(u*1.7-.35);P=V(lastX+8,TOP*.7,28*far).lerp(V(midX,11,62*far),k);Tg=V(lastX+SP,5,0).lerp(V(midX,9,0),k)}
  else{const k=ease(u/.35),j=ease((u-.25)/.6),b=T*.12*(reduce?.35:1)*1.6;
   const shot=V(Math.cos(b)*19*(innerWidth<700?1.35:1),-9,Math.sin(b)*19*(innerWidth<700?1.35:1)).add(OFF);
   P=V(midX+12,8+k*8,(32+k*30)*far).lerp(shot,j);Tg=V(midX,6,0).lerp(V(0,-12,0).add(OFF),j)}
  const f=1-Math.exp(-dt*(reduce?.5:.9)*CFG.cam);cam.position.lerp(P,f);ctl.target.lerp(Tg,f)}
 shells.forEach((s,i)=>s.rotation.y=T*.003*(i+1));
 $('h-step').textContent=Math.max(1,n-CTX.length+(phase===5||appended?0:1));
 $('h-ctx').textContent=n;
 $('h-layer').textContent=lp<=0||phase===5?'—':(Math.min(LN,act+1))+' / '+LN;
 $('h-heads').textContent=phase===1||phase===2?HN+L().par:'—';
 $('h-links').textContent=Math.round(Math.min(lp,LN)*HN*n*(n+1)/2).toLocaleString(L().loc);
 const top=STEPS[0][0];$('h-top').textContent=phase===3||phase===4?top[0]+' · '+Math.round(top[1]*100)+'%':'—';
 $('h-pick').textContent=phase===4&&appended?top[0]:phase===5?toks[n-1].text||'…':'—';
}

// ================= per-frame: world B =================
function tickB(dt,u){
 const lp=phase-6;
 const p0=1,p1=1,thr=lp>0?1:ease(u*2),p2=lp>1?1:lp===1?ease(u/.8):0,p3=lp>2?1:lp===2?ease(u/.8):0,p4=lp===3?ease(u/.8):0;
 rTok.forEach((s,i)=>{const v=ease(p0*words.length-i);s.material.opacity=v;
  s.material.rotation=T*s.userData.spin;s.scale.setScalar(4.6*CFG.star);s.userData.core.scale.setScalar(1.1*CFG.star);s.userData.halo.scale.setScalar(2.6*CFG.star);
  s.position.y=s.userData.base.y+Math.sin(T*1.3+i)*.25;
  const o=s.userData.orb;o.position.copy(s.position);o.rotation.y+=dt*.3;o.material.opacity=v*.35*thr;
  const q=s.userData;q.core.position.copy(s.position);q.core.material.opacity=v;q.halo.position.copy(s.position);q.halo.material.opacity=v*.12;
  q.ghost.position.copy(s.position).addScaledVector(cam.up,.15).add(V(0,0,0).setFromMatrixColumn(cam.matrixWorld,0).multiplyScalar(-.45));q.ghost.material.opacity=v*.55});
 layers.forEach((L,l)=>{const v=ease(p1*RLN-l);L.ring.material.opacity=v*.75;
  L.lines.material.opacity=0;L.lines.geometry.setDrawRange(0,Math.floor(560*CFG.dens)*2);L.ring.rotation.z=T*.1*(l%2?1:-1)});
 trunk.forEach((t,k)=>t.op(lp===0?1:.55));
 sparks.forEach(s=>{const q=s.userData;q.t+=dt*.25;if(q.t>1){q.t=0;q.a=Math.random()*6.283}
  const r=9-q.t*3.6;s.position.set(Math.cos(q.a+q.t*2)*r,-12+q.t*17,Math.sin(q.a+q.t*2)*r);
  s.material.opacity=p1*Math.sin(q.t*Math.PI)*(1-p4*.7)});
 let act=0,cut=0,beads=0;
 {const cnt=tAtt.geometry.attributes.position.count,rev=lp===0?ease(u*1.4):1;tAtt.geometry.setDrawRange(0,Math.floor(cnt*rev/2)*2);
  tAtt.material.opacity=(lp===0?.95:lp===1?.45:.2)*(1-p4*.7)*CFG.dens}
 for(let i=bursts.length-1;i>=0;i--){const o=bursts[i],a=(T-o.t0)/1.1;if(a>=1){kill(o.l);bursts.splice(i,1)}else o.l.material.opacity=Math.sin(a*Math.PI)*.55*CFG.dens}
 branches.forEach(b=>{const g=ease(p2*5-b.depth);if(phase===7&&g>=.97&&!b.burst&&b.depth>=1)makeBurst(b);
  b.m.geometry.setDrawRange(0,Math.floor(41*g));const nb=Math.floor(17*g);b.beads.geometry.setDrawRange(0,nb);beads+=nb;
  let op=g*.9,col=C.b;
  if(!b.alive&&p3>0){const k=ease(p3*1.5-b.depth*.1);op=g*(.7-.6*k);if(k>.3){cut++;col=C.p}}
  else if(b.alive&&p3>0)op=g*(.7+.3*p3);
  op*=1-p4*(b.alive?.3:.6);
  b.m.material.color.setHex(col);b.m.material.opacity=op*.8;
  b.beads.material.color.setHex(col);b.beads.material.opacity=op;b.beads.material.size=.75*CFG.star;
  b.tip.material.color.setHex(col);b.tip.material.opacity=g>.98?op*(.8+.2*Math.sin(T*4+b.depth)):0;
  if(g>.98&&col!==C.p)act++});
 streams.forEach(s=>{const g=ease(p4*1.4-s.o*.4);s.l.geometry.setDrawRange(0,Math.floor(71*g));
  s.l.material.opacity=g*.45;const q=(T*.4+s.o)%1;s.p.position.copy(s.c.getPoint(q));s.p.material.opacity=g>.9?.9:0});
 core.material.opacity=p4*.18;core.children[0].material.opacity=p4;core.rotation.y=T*.4;core.rotation.x=T*.2;
 const pulse=1+Math.sin(T*2.4)*.06;core.scale.setScalar((.3+p4*.7)*pulse);
 coreGlow.material.opacity=p4*.55;coreGlow.scale.setScalar(14*pulse*(.5+p4*.5));
 
 if(camAuto){const a=T*.12*(reduce?.35:1),far=innerWidth<700?1.35:1;let P,Tg;
  if(lp===0){const b=a*1.6;P=V(Math.cos(b)*(19-u*2),-9+u*11,Math.sin(b)*(19-u*2));Tg=V(0,-12+u*9,0)}
  else if(lp===1){const t0=branches[0].tip.position,k=ease(u*1.6-.15);
   P=V(t0.x+5,t0.y+1,t0.z+7).lerp(V(Math.cos(a)*40,12+u*6,Math.sin(a)*40),k);Tg=t0.clone().lerp(V(0,10,0),k)}
  else if(lp===2){const b=a*1.5;P=V(Math.cos(b)*24,13+Math.sin(T*.4)*3,Math.sin(b)*24);Tg=V(0,12,0)}
  else{const k=ease(u*2-.9);P=V(Math.cos(a)*11,25,Math.sin(a)*11).lerp(V(Math.cos(a)*72,14,Math.sin(a)*72),k);Tg=CORE.clone().lerp(V(0,6,0),k)}
  P.x*=far;P.z*=far;P.add(OFF);Tg=Tg.clone().add(OFF);
  const f=1-Math.exp(-dt*(reduce?.5:.9)*CFG.cam);cam.position.lerp(P,f);ctl.target.lerp(Tg,f)}
 shells.forEach((s,i)=>s.rotation.y=T*.003*(i+1));
 $('b-tok').textContent=(beads*1200+Math.round(p1*80)).toLocaleString(L().loc);
 $('b-hyp').textContent=act;$('b-cut').textContent=cut;
 $('b-conf').textContent=Math.round(20+p2*15+p3*35+p4*29)+'%';
 $('b-dep').textContent=Math.min(5,Math.ceil(p2*5));
 $('b-ent').textContent=Math.max(0,.3+p2*2.6-p3*1.7-p4*.9+Math.sin(T*1.7)*.05).toFixed(2)+L().bits;
 $('b-tps').textContent=Math.round((60+p2*110-p4*60)*(1+Math.sin(T*2.3)*.15))+L().tps;
}

// ================= loop =================
let last=performance.now();
function tick(now){
 const dt=Math.min((now-last)/1000,.05)*CFG.speed;last=now;T+=dt;pt+=dt;
 if(auto&&pt>DUR)nextPhase();
 if(!camAuto&&now-lastTouch>8000){camAuto=true;updCamBtn()}
 const u=Math.min(1,pt/DUR);
 fadeV=Math.max(0,fadeV-dt*1.4);
 if(world===0)tickA(dt,u);else tickB(dt,u);
 fadeEl.style.opacity=fadeV.toFixed(3);
 ctl.update();R.render(S,cam);requestAnimationFrame(tick)}

 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=L()[el.dataset.t]);
 [...rail.querySelectorAll('.ph')].forEach((b,i)=>b.textContent=PH[i][0]+' '+PH[i][1]);
 ab.textContent=L().auto;updCamBtn();vb.textContent=voiceOn?L().vOn:L().vOff;gb.textContent=L().gear;agb.textContent=L().again;lb2.textContent=L().lang;

(document.fonts&&document.fonts.load?document.fonts.load('44px "JetBrains Mono"'):Promise.resolve()).then(go,go);setTimeout(go,1500);

<script>(function(){if(!new URLSearchParams(location.search).has('embed'))return;document.documentElement.classList.add('embed');

let VO=[],live=false;auto=false;const os=setPhase;setPhase=function(i){os(i);const k=i-(0),v=VO[k];if(v)DUR=Math.max(DUR,(v+.9)*CFG.speed);if(live)parent.postMessage({t:'phase',k},'*')};
